AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PDF Processor Application

# Global parameters and settings
Globals:
  Function:
    Timeout: 300  # 5 minutes
    MemorySize: 3008  # Loading torch and MinerU alone uses about 1 GB
    Environment:
      Variables:
        # Use the name, not !Ref, to avoid a cycle with the S3 trigger
        PDF_BUCKET: !Sub ${AWS::StackName}-pdfs-${AWS::AccountId}
        TEXT_BUCKET: !Ref TextBucket
        SUMMARY_BUCKET: !Ref SummaryBucket
        JOBS_TABLE: !Ref JobsTable
        GROK_API_URL: !Ref GrokApiUrl
        GROK_API_KEY: !Ref GrokApiKey
        SECRET_KEY: !Ref SecretKey
        WEBHOOK_SECRET: !Ref WebhookSecret
        DEFAULT_WEBHOOK_URL: !Ref DefaultWebhookUrl

Parameters:
  GrokApiUrl:
    Type: String
    Default: https://api.x.ai/v1/chat/completions
    Description: URL for the Grok API
  
  GrokApiKey:
    Type: String
    NoEcho: true
    Description: API Key for Grok
  
  SecretKey:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Secret key for the application

  WebhookSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Shared secret for signing webhooks. Webhooks are not sent when empty.

  DefaultWebhookUrl:
    Type: String
    Default: ''
    Description: HTTPS webhook URL used when a job does not provide one

Resources:
  # Lambda Function
  PDFProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["lambda_handler.lambda_handler"]
      Architectures:
        - x86_64
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub ${AWS::StackName}-pdfs-${AWS::AccountId}
        - S3WritePolicy:
            BucketName: !Sub ${AWS::StackName}-pdfs-${AWS::AccountId}
        - S3ReadPolicy:
            BucketName: !Ref TextBucket
        - S3WritePolicy:
            BucketName: !Ref TextBucket
        - S3ReadPolicy:
            BucketName: !Ref SummaryBucket
        - S3WritePolicy:
            BucketName: !Ref SummaryBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
      # A failed job is final, so document.failed is never followed by a retry
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Events:
        ApiUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref PDFProcessorApi
            Path: /upload
            Method: post
        ApiStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref PDFProcessorApi
            Path: /status/{id}
            Method: get
        ApiSummary:
          Type: HttpApi
          Properties:
            ApiId: !Ref PDFProcessorApi
            Path: /summary/{id}
            Method: get
        PdfUploaded:
          Type: S3
          Properties:
            Bucket: !Ref PDFBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
                  - Name: suffix
                    Value: .pdf
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .

  # DynamoDB Table for tracking jobs
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH

  # S3 Buckets
  PDFBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-pdfs-${AWS::AccountId}
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - '*'
            ExposedHeaders:
              - ETag
  
  TextBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-texts-${AWS::AccountId}
  
  SummaryBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-summaries-${AWS::AccountId}

  # API Gateway HTTP API
  PDFProcessorApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowOrigins:
          - '*'

Outputs:
  PDFProcessorFunction:
    Description: "PDF Processor Lambda Function ARN"
    Value: !GetAtt PDFProcessorFunction.Arn
  
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${PDFProcessorApi}.execute-api.${AWS::Region}.amazonaws.com"
  
  PDFBucket:
    Description: "S3 bucket for PDF uploads"
    Value: !Ref PDFBucket
  
  TextBucket:
    Description: "S3 bucket for extracted text"
    Value: !Ref TextBucket
  
  SummaryBucket:
    Description: "S3 bucket for summaries"
    Value: !Ref SummaryBucket
  
  JobsTable:
    Description: "DynamoDB table for tracking jobs"
    Value: !Ref JobsTable